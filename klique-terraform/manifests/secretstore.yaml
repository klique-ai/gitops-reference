apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  # Referenced by name from every ExternalSecret in the GitOps repo.
  name: klique-secrets
  namespace: ${namespace}
  labels:
    app.kubernetes.io/managed-by: Terraform
spec:
%{ if refresh_interval > 0 ~}
  refreshInterval: ${refresh_interval}
%{ endif ~}
  provider:
    ${provider}
