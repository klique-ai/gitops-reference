apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${name}
  namespace: ${namespace}
  labels:
    app.kubernetes.io/managed-by: Terraform
spec:
  secretName: ${name}
  duration: ${duration}
  renewBefore: ${renew_before}
  privateKey:
    algorithm: ${key_algorithm}
%{ if key_algorithm != "Ed25519" ~}
    size: ${key_size}
%{ endif ~}
    # Always = a new key on every renewal, not just a new certificate.
    rotationPolicy: ${key_rotation_policy}
  issuerRef:
    group: cert-manager.io
    kind: ${issuer_kind}
    name: ${issuer_name}
  dnsNames:
%{ for n in dns_names ~}
    - "${n}"
%{ endfor ~}
