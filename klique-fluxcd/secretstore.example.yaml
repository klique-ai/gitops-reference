# The ESO store every ExternalSecret in klique/ reads from — by hand, for
# clusters where klique-terraform is not used. klique-terraform creates the
# same object from secret_store.provider_yaml. NOT reconciled by Flux: backend
# choice and backend auth are per-installation facts, not desired state.
#
# REPLACE the provider block with your own backend, then:
#   kubectl apply -f secretstore.example.yaml
# Until a store exists, every ExternalSecret stays NotReady — a loud failure
# on purpose, not a bug.
#
# This is the ONLY store on your backend, and it serves the klique namespace
# only. Tenant namespaces get their pull secret from klique/secretstore-tenants.yaml,
# a store that can read just the klique-dockerhub Secret this one materialises:
# no tenant namespace can reach your backend.
#
# The full provider list (AWS, GCP, Azure, Vault, and more):
# https://external-secrets.io/latest/provider/provider-list/
#
# Example — AWS Secrets Manager with static credentials:
#   provider:
#     aws:
#       service: SecretsManager
#       region: <region>
#       auth:
#         secretRef:
#           accessKeyIDSecretRef: { name: es-aws-creds, key: access-key-id }
#           secretAccessKeySecretRef: { name: es-aws-creds, key: secret-access-key }
#
# Example — HashiCorp Vault with Kubernetes auth:
#   provider:
#     vault:
#       server: https://vault.example.com
#       path: kv
#       version: v2
#       auth:
#         kubernetes:
#           mountPath: kubernetes
#           role: klique
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: klique-secrets
  namespace: klique
spec:
  provider: {}
