# This tenant's IdP secrets (OIDC client secrets, SAML private keys). Pointers
# only: the values stay in your backend.
#
# Each secretKey here is what tenant.json refers to as {"key": "<secretKey>"}.
# The Job reads it as a file, from the Secret this materialises.
#
# Written per tenant, but nothing tenant-specific needs editing when you copy
# it: ../../tenant-reconciler/replacements.yaml renames tenant-sso to
# <tenant>-sso, moves it to klique (where SecretStore klique-secrets lives, and
# where the secrets stay — never in the tenant namespace), and sets the third
# segment of every remoteRef key to the tenant name. So keep keys shaped like
# klique/tenants/<anything>/<anything>; scripts/check.sh fails on any other
# shape.
#
# A tenant with no IdP secret: delete this file and its `resources:` line.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: klique-secrets
    kind: SecretStore
  target:
    name: tenant-sso
    creationPolicy: Owner
    # Retain: a transient backend failure must not delete the Secret a
    # running Job is about to read.
    deletionPolicy: Retain
  data:
    - secretKey: oidcClientSecret
      remoteRef:
        key: klique/tenants/tenant-example/sso
        property: oidcClientSecret
