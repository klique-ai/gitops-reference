# Helm values for the control-plane chart.
#
# Four sources feed this release, in valuesFrom order:
#   1. klique-platform / control-plane.yaml — the cluster-specific keys
#      (hostnames, IngressClass, TLS Secret, cookieDomain, public URLs, the CA
#      to trust), written by klique-terraform or by hand from
#      ../klique-platform.example.yaml
#   2. this file — what the control plane does
#   3. klique-platform / control-plane-overrides.yaml — optional overrides
#      from klique-terraform's klique_values tfvar; deliberately wins over 2
#   4. credentials, injected via targetPath
# Apart from 3's deliberate overrides, no key may appear in two of them: a
# later source wins a collision silently, and a list split across two is
# replaced, not merged.

# --- Image pulls -------------------------------------------------------------
# Three keys, because three consumers each read their own shape:
#   imageCredentials.existingImagePullSecrets    -> this chart's own workloads
#   global.imagePullSecrets                      -> the valkey/elasticsearch subcharts
#   mongodb-kubernetes.registry.imagePullSecrets -> the MongoDB operator
# All point at the same ESO-materialised dockerconfigjson Secret. Set only one
# and the others keep pointing at a chart-generated credential that does not
# work.
imageCredentials:
  existingImagePullSecrets:
    - name: klique-dockerhub

global:
  imagePullSecrets:
    - klique-dockerhub

mongodb-kubernetes:
  registry:
    imagePullSecrets: klique-dockerhub

controlPlane:
  # Seat cap: the UI refuses to add the (maxUsers+1)th user.
  maxUsers: 20

apiserver:
  # The fixed admin login, mounted as a config file out of the klique-users
  # Secret (see externalsecret-users.yaml). This takes precedence over the
  # chart's inline additionalConfigs — future apiserver config overrides go in
  # that Secret, not here.
  existingAdditionalConfigsSecret: klique-users

  # OWNERSHIP: this list is owned by this file in its entirety. Helm REPLACES
  # lists rather than merging them, so a second apiserver.extraEnvs anywhere
  # else would silently drop this one.
  extraEnvs:
    # Tenant login: each tenant signs in at https://<app host>/login/<tenant>
    # through its own IdP (configured by ../tenants/, see tenants/README.md).
    - name: CLEARML__services__login__sso__tenant_login
      value: "true"
    # Keep the check: a login is accepted only when the IdP's tenant claim
    # names the tenant being logged in to. It is NOT isolation between
    # tenants: the server does not bind a provider to its own tenant, so any
    # tenant's IdP that puts another tenant's name in the claim signs users in
    # there. Every tenant's IdP must be trusted not to forge the claim (see
    # tenants/README.md). The server default, stated so nobody turns it off.
    - name: CLEARML__services__login__sso__skip_tenant_check
      value: "false"

# Ingresses (apiserver, fileserver, webserver), displayedServerURLs and the
# Apps' URL overrides all come from klique-platform — see the header.

# Klique Apps.
applications:
  enabled: true

# The Platform Management server: the tenants.* API the tenant reconciler Jobs
# call to create tenants and mint their keys. In-cluster only (no ingress): no
# user reaches it, and its credential pair is generated by the chart into
# klique-conf, so it needs nothing from your backend.
platformManagementServer:
  enabled: true
  # OWNERSHIP: owned by this file in its entirety, like apiserver.extraEnvs.
  extraEnvs:
    # Same setting as on the apiserver: this server also reads it (how it
    # reports tenant users' emails).
    - name: CLEARML__services__login__sso__tenant_login
      value: "true"

# The MCP server component is enabled by default and needs no values here: it
# derives its apiserver address and credentials from this release, and the
# webserver proxies it under the app hostname's /mcp path.
