# The fixed admin login for the web UI. Pointer only.
#
# WHY A CONFIG FILE AND NOT env vars: the fixed-user list is a list of records,
# and env overrides map cleanly onto scalars only. The chart mounts this Secret
# into the apiserver's config directory
# (apiserver.existingAdditionalConfigsSecret in values/control-plane.yaml), so
# each key here becomes a FILENAME there — and that mount takes precedence
# over the chart's inline additionalConfigs: any future apiserver config
# override belongs in THIS Secret, not in Helm values, or it is silently
# shadowed.
#
# `| quote` is required, not style: these lines land in HOCON, where a bare
# value may not contain + = @ , { } # — a password with # is silently truncated
# at the character and login just fails, with no error anywhere. If you would
# rather not store plaintext in your backend at all, set pass_hashed: true and
# store a bcrypt hash instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: klique-users
  namespace: klique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: klique-secrets
    kind: SecretStore
  target:
    name: klique-users
    creationPolicy: Owner
    # Retain: a transient failure must not delete the user list out from under
    # a running apiserver and lock everyone out of the UI.
    deletionPolicy: Retain
    template:
      data:
        apiserver.conf: |
          auth {
            fixed_users {
              enabled: true
              pass_hashed: false
              users: [
                {
                  username: {{ .admin_user | quote }}
                  password: {{ .admin_password | quote }}
                  name: "Admin User"
                  admin: true
                },
              ]
            }
          }
  data:
    - secretKey: admin_user
      remoteRef:
        key: klique/apiserver
        property: admin_user
    - secretKey: admin_password
      remoteRef:
        key: klique/apiserver
        property: admin_password
