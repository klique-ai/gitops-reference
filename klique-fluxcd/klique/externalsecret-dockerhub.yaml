# Docker Hub credential for pulling the Klique charts (OCI) and images.
#
# A POINTER: names and keys only — the value lives in your secret backend and
# ESO materialises it here. Rotation is a backend update, not a commit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: klique-dockerhub
  namespace: klique
spec:
  refreshInterval: 1h
  # SecretStore/klique-secrets is created by klique-terraform
  # (secret_store.provider_yaml), or by hand from ../secretstore.example.yaml.
  secretStoreRef:
    name: klique-secrets
    kind: SecretStore
  target:
    name: klique-dockerhub
    creationPolicy: Owner
    # Retain: a transient ESO or backend failure must not delete the credential
    # out from under running pods and turn a blip into ImagePullBackOff.
    deletionPolicy: Retain
    template:
      # dockerconfigjson — the one format every consumer takes: the Flux
      # HelmRepository, and the imagePullSecrets the charts reference BY NAME.
      type: kubernetes.io/dockerconfigjson
      data:
        # All three hostname forms on purpose. Flux's source-controller looks
        # the credential up by the HelmRepository URL's host; the kubelet
        # accepts any of these when pulling `docker.io/...` images. Dropping
        # one breaks either chart pulls or image pulls.
        #
        # toJson, not "{{ .x }}": it escapes a " or \ in the value, which would
        # otherwise produce invalid JSON and fail every pull.
        .dockerconfigjson: |
          {
            "auths": {
              "docker.io": {
                "username": {{ .username | toJson }},
                "password": {{ .password | toJson }},
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              },
              "index.docker.io": {
                "username": {{ .username | toJson }},
                "password": {{ .password | toJson }},
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              },
              "https://index.docker.io/v1/": {
                "username": {{ .username | toJson }},
                "password": {{ .password | toJson }},
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: klique/registry/dockerhub
        property: username
    - secretKey: password
      remoteRef:
        key: klique/registry/dockerhub
        property: password
