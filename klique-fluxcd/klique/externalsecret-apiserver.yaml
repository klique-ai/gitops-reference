# The apiserver's own service credential pair (key/secret). Pointer only.
#
# There is no agent pair any more: each tenant's orchestrator and gateway
# authenticate with keys minted for that tenant by its reconciler Job (Secrets
# orchestrator and app-gateway in the tenant namespace), not from your backend.
#
# The same entry also carries admin_user/admin_password, read by
# externalsecret-users.yaml as a separate Secret — separate because that one is
# mounted as a config directory where every key becomes a filename, so it
# cannot share this Secret's shape. One backend entry, two Kubernetes Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: klique-apiserver
  namespace: klique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: klique-secrets
    kind: SecretStore
  target:
    name: klique-apiserver
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: key
      remoteRef:
        key: klique/apiserver
        property: key
    - secretKey: secret
      remoteRef:
        key: klique/apiserver
        property: secret
