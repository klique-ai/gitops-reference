# The Platform Management Center's own OIDC login: the IdP the platform admins
# sign in with. Pointer only, like every ExternalSecret here.
#
# NOT a tenant's IdP. Tenants' users log in to the app at app.<domain> through
# their tenant folder's providers; the PMC administers every tenant, so its
# users must come from a separate user store — with Keycloak, a realm of their
# own. Pointing this at a tenant's realm lets that tenant's users manage the
# whole platform.
#
# Consumed by platformManagementServer.extraEnvs in values/control-plane.yaml,
# every reference optional: until the backend entry exists the server starts
# with no SSO provider, and the PMC shows no way to log in.
#
# The URLs are in the entry too, though not secret: the IdP is a per-install
# fact this repo cannot know, and one entry keeps the client and its endpoints
# from drifting apart. Use the oauth_client key `keycloak` (Keycloak's URL
# shapes, below); the redirect URI to register on the client is
# https://<pmc host>/callback_keycloak.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: klique-pmc-sso
  namespace: klique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: klique-secrets
    kind: SecretStore
  target:
    name: klique-pmc-sso
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: klique/platform-management/sso
        property: clientId
    - secretKey: client_secret
      remoteRef:
        key: klique/platform-management/sso
        property: clientSecret
    # https://<keycloak>/realms/<realm>/ — the trailing slash matters (relative
    # endpoints resolve against it). Browser-facing: the IdP logout redirect.
    - secretKey: base_url
      remoteRef:
        key: klique/platform-management/sso
        property: baseUrl
    # .../protocol/openid-connect/auth — browser-facing.
    - secretKey: authorize_url
      remoteRef:
        key: klique/platform-management/sso
        property: authorizeUrl
    # .../protocol/openid-connect/token — called by the server, so it may be an
    # in-cluster address; over https its CA must be one the server trusts.
    - secretKey: token_url
      remoteRef:
        key: klique/platform-management/sso
        property: tokenUrl
