# The pull secret klique-dockerhub in every tenant namespace, for that tenant's
# orchestrator, gateway and task pods. One object for all tenants: ESO creates
# (and removes) an ExternalSecret in each namespace labelled
# klique.clearml.ai/tenant=true. It copies Secret klique/klique-dockerhub as is
# (already dockerconfigjson) through ClusterSecretStore klique-dockerhub
# (secretstore-tenants.yaml), so rotating the backend entry rotates every copy.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: klique-dockerhub
spec:
  namespaceSelectors:
    - matchLabels:
        klique.clearml.ai/tenant: "true"
  refreshTime: 1m
  externalSecretName: klique-dockerhub
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: klique-dockerhub
      kind: ClusterSecretStore
    target:
      name: klique-dockerhub
      creationPolicy: Owner
      # Retain: a transient failure must not delete the credential out from
      # under running pods.
      deletionPolicy: Retain
      # Type only, no data template: ESO then keeps the fetched keys as they
      # are (here the one key .dockerconfigjson).
      template:
        type: kubernetes.io/dockerconfigjson
    # extract, not data/property: a property starting with "." would be read
    # as a JSON path by the kubernetes provider.
    dataFrom:
      - extract:
          key: klique-dockerhub
