# Where every tenant namespace's copy of the pull secret comes from: Secret
# klique-dockerhub in THIS namespace (materialised by externalsecret-dockerhub.yaml),
# read through the ESO `kubernetes` provider. Not your secret backend: a store
# on the backend would let every tenant namespace read every backend entry
# (klique/apiserver included), since ESO cannot limit which keys a store
# serves. This one can read exactly one Secret.
#
# Three pieces: the identity ESO uses (ServiceAccount), what that identity may
# do (get on the ONE Secret klique-dockerhub), and the store, usable only from
# namespaces labelled klique.clearml.ai/tenant=true (the tenant component
# labels every tenant namespace). clusterexternalsecret-dockerhub.yaml is the
# only consumer.
#
# ESO validates the store with a SelfSubjectRulesReview and accepts a `get`
# rule on secrets whatever its resourceNames; reading uses `get` only (no
# list), so this narrow Role is enough.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: klique-dockerhub-reader
  namespace: klique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: klique-dockerhub-reader
  namespace: klique
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [klique-dockerhub]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: klique-dockerhub-reader
  namespace: klique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: klique-dockerhub-reader
subjects:
  - kind: ServiceAccount
    name: klique-dockerhub-reader
    namespace: klique
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: klique-dockerhub
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          klique.clearml.ai/tenant: "true"
  provider:
    kubernetes:
      remoteNamespace: klique
      server:
        # The in-cluster API server (the default URL), trusted through the CA
        # every namespace gets.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: klique
      auth:
        serviceAccount:
          name: klique-dockerhub-reader
          namespace: klique
