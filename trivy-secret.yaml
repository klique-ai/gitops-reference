# Trivy's built-in secret allow-rules skip test paths, but tests/kind-e2e/ handles real credentials
# at run time, so a token committed there must still fail the scan. Rule ID verified against
# trivy 0.76.1 (a token under tests/ is reported once this is set). The root location is trivy's
# default config name, so a plain `trivy fs` honors it too.
disable-allow-rules:
  - tests
