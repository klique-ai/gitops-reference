# This e2e tenant's IdP secret: its Keycloak OIDC client secret, which e2e.sh
# generates per run and writes to OpenBao at klique/tenants/tenant-e2e/sso.
# Same shape as klique-fluxcd/tenants/tenant-example/externalsecret-sso.yaml;
# the component's replacements rename and move it the same way.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: klique-secrets
    kind: SecretStore
  target:
    name: tenant-sso
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: oidcClientSecret
      remoteRef:
        key: klique/tenants/tenant-e2e/sso
        property: oidcClientSecret
